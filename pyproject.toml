[build-system]

requires = ["setuptools>=61"]

build-backend = "setuptools.build_meta"


[project]

name = "labs"

version = "0.1.0"

description = "Add your description here"

requires-python = ">=3.12"

dependencies = [
    "pytest>=8.4.2",
]


[tool.pytest.ini_options]

pythonpath = ["src"]

testpaths = ["tests"]


[tool.setuptools.packages.find]

where = ["src"]


[tool.mypy]

mypy_path = ["src"]
